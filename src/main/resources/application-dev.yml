logging:
  level:
    org:
      springframework:
        security: TRACE

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/stalkers?createDatabaseIfNotExist=true&serverTimezone=UTC&cachePrepStmts=true&useServerPrepStmts=true&rewriteBatchedStatements=true
    username: root
    password: admin

  jpa:
    show-sql: true

  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/testdata

  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 10000

# Expiration Time in seconds - One Week
authentication:
  token:
    refresh-token:
      expiration-time: 604800
    access-token:
      expiration-time: 86400

stalkers:
  storage:
    local:
      dir:
        images: /home/bob/Documents/stalkers

client:
  domain: localhost
  oauth2RedirectAfter: http://localhost:3000/login/google/success
